name: Heartbeat

# An hourly liveness pulse, independent of the daily source pipeline.
#
# update-data.yml writes heartbeat.json's `lastRun` only when it runs, which
# is manual since 10.10.2026. This workflow keeps a separate `lastHeartbeat`
# field moving every hour, so the pipeline can be seen to be alive.
#
# Deliberately touches no external source — it rewrites one JSON field and
# pushes, adding ZERO traffic to gov.il.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two pulses race for the same push.
concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tip of main, not the triggering SHA — same reasoning as update-data.yml.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the hourly pulse (preserves lastRun)
        run: python pipeline/write_heartbeat.py lastHeartbeat

      - name: Commit and push
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/heartbeat.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "heartbeat: pulse $(date -u +%FT%H:%MZ)"
          # update-notams.yml pushes to main every 15-25 minutes and the daily
          # pipeline pushes too, so a race is normal. Replay on top rather than
          # failing; a pulse that never lands is left for the next hour.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "could not push the pulse; the next hourly run will retry" >&2
